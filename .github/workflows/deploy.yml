name: CI/CD Pipeline for Windows Web Server

on:
  push:
    branches: [ main ]

env:
  WEB_SERVER_PATH: 'D:\WebSites\MyApp'

jobs:
  test-job:
    name: Run automated tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Execute test script
        shell: powershell
        run: ./test.ps1

  deploy-job:
    name: Deploy to IIS Server
    runs-on: self-hosted
    needs: test-job
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
      
      - name: Copy files to web directory
        shell: powershell
        run: |
          Write-Host "Copying files to $env:WEB_SERVER_PATH" -ForegroundColor Yellow
          robocopy . $env:WEB_SERVER_PATH /MIR /R:2 /W:2 /NP
          $rc = $LASTEXITCODE
          Write-Host "Robocopy exit code: $rc" -ForegroundColor Cyan
          if ($rc -ge 8) {
            Write-Host "❌ Robocopy failed with exit code $rc" -ForegroundColor Red
            exit 1
          } else {
            Write-Host "✅ Files copied successfully! (exit code $rc)" -ForegroundColor Green
            exit 0
          }
      
      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "Verifying deployment..." -ForegroundColor Yellow
          if (Test-Path "$env:WEB_SERVER_PATH\index.html") {
            Write-Host "✅ index.html deployed successfully" -ForegroundColor Green
          } else {
            Write-Host "❌ Deployment failed - index.html not found" -ForegroundColor Red
            exit 1
          }
      
      - name: Deployment completed
        run: echo "✅ Deployment completed successfully!"