name: CI/CD Pipeline for Windows Web Server

on:
  push:
    branches: [ main ]

env:
  WEB_SERVER_PATH: 'D:\WebSites\MyApp'

jobs:
  # JOB 1: Тестирование
  test-job:
    name: Run automated tests
    runs-on: self-hosted  # runner на вашем компьютере
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Execute test script
        shell: powershell
        run: ./test.ps1

  # JOB 2: Деплой (зависит от успеха теста)
  deploy-job:
    name: Deploy to IIS Server
    runs-on: self-hosted
    needs: test-job  # запускается только после успешного теста
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
      
      - name: Stop IIS Site
        shell: powershell
        run: |
          Write-Host "Stopping IIS Site..."
          & 'C:\Windows\System32\inetsrv\appcmd.exe' stop site "MyApp"
      
      - name: Copy files to web directory
        shell: powershell
        run: |
          Write-Host "Copying files to $env:WEB_SERVER_PATH"
          robocopy . $env:WEB_SERVER_PATH /MIR /R:1 /W:1
          exit 0
      
      - name: Start IIS Site
        shell: powershell
        run: |
          Write-Host "Starting IIS Site..."
          & 'C:\Windows\System32\inetsrv\appcmd.exe' start site "MyApp"
          Write-Host "Deployment completed!"